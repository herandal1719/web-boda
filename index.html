<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Claudia & Alberto | Boda</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --blanco: #FFF8F0;
      --dorado: #E8C39A;
      --gris: #555;
      --negro-suave: #333;
    }

    * { box-sizing: border-box; scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Lato', sans-serif; background: var(--blanco); color: var(--gris); line-height: 1.4; overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--negro-suave); text-align: center; margin-bottom: 8px; }

    .separator { display: flex; align-items: center; justify-content: center; margin: 20px auto; width: 50%; max-width: 150px; }
    .separator::before, .separator::after { content: ""; flex: 1; height: 1px; background: var(--dorado); opacity: 0.4; }
    .separator i { color: var(--dorado); margin: 0 10px; font-size: 0.6rem; }

    nav { position: fixed; top: 0; width: 100%; background: rgba(255,248,240,0.98); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1000; }
    nav ul { display: flex; justify-content: center; gap: 5px; list-style: none; padding: 8px; margin: 0; flex-wrap: wrap; }
    nav li { cursor: pointer; font-size: 9px; padding: 4px; font-weight: bold; text-transform: uppercase; }
    nav li:hover { color: var(--dorado); }
    .lang-switch { color: var(--dorado); border-left: 1px solid #ddd; padding-left: 8px !important; }

    header { height: 75vh; min-height: 450px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; color: white; overflow: hidden; }
    .hero-images { position: absolute; inset: 0; display: flex; }
    .hero-img { width: 50%; background-size: cover; background-position: center 20%; filter: brightness(0.8); }
    header::after { content: ""; position: absolute; bottom: 0; width: 100%; height: 35%; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
    .hero-content { position: relative; z-index: 3; padding-bottom: 25px; }
    header h1 { color: white; font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
    header p { color: white; font-size: 1.1rem; letter-spacing: 4px; font-family: 'Playfair Display', serif; }

    section { padding: 10px 20px; max-width: 800px; margin: auto; }
    .welcome-text { text-align: center; font-style: italic; font-size: 1rem; max-width: 600px; margin: auto; line-height: 1.6; }

    footer { text-align: center; padding: 20px; background: #fff; font-size: 0.75rem; border-top: 1px solid #eee; }
  </style>
</head>

<body>

<nav>
  <ul>
    <li onclick="scrollToId('home')">Inicio</li>
    <li onclick="scrollToId('bienvenida')">Historia</li>
    <li class="lang-switch" onclick="setLang('es')">ES</li>
    <li class="lang-switch" onclick="setLang('it')">IT</li>
  </ul>
</nav>

<header id="home">
  <div class="hero-images">
    <div class="hero-img" style="background-image:url('IMG/foto1.jpeg')"></div>
    <div class="hero-img" style="background-image:url('IMG/foto2.jpeg')"></div>
  </div>
  <div class="hero-content">
    <h1>Claudia & Alberto 💕</h1>
    <p>01 · 08 · 2026</p>
  </div>
</header>

<div class="separator"><i class="fa-solid fa-diamond"></i></div>

<section id="bienvenida">
  <div class="welcome-text">
    <p data-i18n="bienvenida_texto"></p>
  </div>
</section>

<div class="separator"><i class="fa-solid fa-diamond"></i></div>

<footer>
  <p>© 2026 Claudia & Alberto · Hecho con ❤️</p>
</footer>

<script>
const translations = {
  es: {
    bienvenida_texto:
      "Algunas historias empiezan muy lejos de casa. La nuestra comenzó en Grecia, en 2015, cuando dos caminos —Italia y España— se cruzaron casi sin saber que no volverían a separarse.\n\n" +
      "Después llegaron los viajes, las risas, las decisiones compartidas y las ganas de seguir avanzando juntos.\n\n" +
      "Hoy celebramos lo más importante: el camino que seguimos construyendo, y la suerte de tenerte cerca."
  },
  it: {
    bienvenida_texto:
      "Alcune storie iniziano lontano da casa. La nostra è cominciata in Grecia, nel 2015, quando due strade —Italia e Spagna— si sono incontrate senza sapere che non si sarebbero più separate.\n\n" +
      "Poi sono arrivati i viaggi, le risate, le scelte condivise e il desiderio di continuare insieme.\n\n" +
      "Oggi celebriamo ciò che conta davvero: il cammino che stiamo costruendo e la fortuna di averti con noi."
  }
};

let currentLang = "es";

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = translations[lang][el.dataset.i18n];
  });
}

function scrollToId(id) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth" });
}

setLang("es");
</script>

</body>
</html>
